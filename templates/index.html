<!-- ==============================================================================
  صفحة الدخول الرئيسية للمونيتور (index.html)
  تتيح للموظف اختيار المنطقة بصرياً بكروت مضيئة ثم إدخال اسمه لبدء الفحص
============================================================================== -->
<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Games Check</title>
    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- استدعاء ملف الستايل المتجاوب للموبايل والتابلت -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');

        }
    </script>
    <style>
        .area-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 25px;
            margin-top: 15px;
        }

        .area-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            border: 5px solid var(--surface-border, #a0aec0);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
            background: var(--surface-glass, #edf2f7);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .area-card:hover {
            transform: translateY(-2px);
            border-color: var(--brand-pink, #e4006c);
            box-shadow: 0 10px 15px -3px rgba(228, 0, 108, 0.3);
        }

        .area-card.selected {
            border-color: var(--success, #48bb78);
            box-shadow: 0 10px 15px -3px rgba(52, 208, 88, 0.3), 0 4px 6px -2px rgba(52, 208, 88, 0.2);
        }

        .area-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .area-card-label-wrapper {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 10px;
        }

        .area-card-label {
            background: var(--surface-glass, rgba(255, 255, 255, 0.35));
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.4));
            color: var(--text-primary, #1a202c);
            font-weight: 800;
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 9999px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            text-transform: uppercase;
            width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        .area-card.selected .area-card-label {
            background: var(--success);
            border-color: var(--success);
            color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(40, 167, 69, 0.25);
        }

        .lang-switch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-glass);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .lang-switch-btn:hover {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
        }

        @media (max-width: 480px) {
            .area-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .area-card {
                border-width: 4px;
                border-radius: 20px;
            }

            .area-card-label {
                font-size: 12px;
                padding: 6px 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Blobs -->
    <div class="ambient-blob blob-blue"></div>
    <div class="ambient-blob blob-pink"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-btn" onclick="toggleTheme()"
        title="Toggle Theme" style="z-index: 9999;">
        🌓
    </div>

    <!-- Top Language Switcher Bar -->
    <div style="max-width: 600px; margin: 15px auto 0 auto; display: flex; justify-content: flex-end;">
        
        
    </div>

    <!-- Login Card -->
    <div class="monitor-container glass-card"
        style="margin-top: 10px; padding: 24px; border-top: 4px solid var(--brand-blue);">
        <h2 class="monitor-title" style="color: var(--brand-blue);">🎮 Daily Games Check System</h2>
        <p class="sub-title" style="color: var(--text-secondary);">Select an area first by clicking its image, then enter your name to start</p>

        <!-- Form -->
        <form method="POST" id="loginForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <!-- Area Grid -->
            <label class="form-label" style="color: var(--text-primary); font-weight: 700;">📍 Select Area:</label>
            <div class="area-grid">
                {% for area in areas %}
                <div class="area-card" data-area-id="{{ area.id }}" onclick="selectArea(this)">
                    {% if area.image %}
                    <img src="{{ area.image }}" class="area-card-img" alt="{{ area.name }}">
                    {% else %}
                    <div
                        style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--input-bg); color: #94a3b8; font-size: 30px;">
                        🗺️</div>
                    {% endif %}
                    <div class="area-card-label-wrapper">
                        <div class="area-card-label">{{ area.name }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <!-- Hidden Selected Area Input -->
            <input type="hidden" name="area" id="selected_area_input" required>

            <!-- Inspector Name Input -->
            <div id="nameInputSection">
                <label class="form-label" style="color: var(--text-primary); font-weight: 700;">👤 Inspector / Monitor Name:</label>
                <input type="text" name="monitor_name" class="glass-input" style="padding: 15px;" required
                    placeholder="Type your name here..."
                    value="{{ session.get('monitor_name', '') }}">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary"
                style="width: 100%; font-size: 18px; margin-top: 20px; padding: 15px;">
                🚀 Start Check
            </button>
        </form>

        <!-- Admin Login Link -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="/admin_login" style="color: #6c757d; text-decoration: none; font-size: 14px; font-weight: 600;">🔒
                Admin & Maintenance Login</a>
        </div>
    </div>

    {% include 'components/modal.html' %}
    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function selectArea(cardElement) {
            document.querySelectorAll('.area-card').forEach(card => {
                card.classList.remove('selected');
            });

            cardElement.classList.add('selected');

            const areaId = cardElement.getAttribute('data-area-id');
            document.getElementById('selected_area_input').value = areaId;
        }


        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (e) {
            const selectedArea = document.getElementById('selected_area_input').value;
            if (!selectedArea) {
                e.preventDefault();
                showModal('⚠️ Alert', 'Please select an area first by clicking on its image.', [
                    { text: 'OK', type: 'primary' }
                ]);
                return;
            }

            // Stop form from submitting immediately to check for active sessions
            e.preventDefault();

            fetch('/api/session_status/' + selectedArea)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'locked_split') {
                        showModal('⚠️ غير مسموح (Blocked)', data.message, [
                            { text: 'OK', type: 'primary' }
                        ]);
                        return;
                    }

                    if (data.status === 'ok' && (data.active_inspectors.length > 0 || data.completed_games.length > 0)) {
                        let inspectorsStr = data.active_inspectors.join(' و ');
                        
                        if (data.active_inspectors.length > 0) {
                            let msg = `There is an active inspection by (${inspectorsStr})\n\nDo you want to join?`;
                            showModal('👥 Active Session', msg, [
                                { text: 'Yes, Join', type: 'success', onClick: () => form.submit() },
                                { text: 'Cancel', type: 'secondary' }
                            ]);
                        } else {
                            let completedCount = data.completed_games.length;
                            let msg = `There is an incomplete inspection with (${completedCount}) saved games by colleagues.\n\nWhat do you want to do?`;
                            
                            showModal('⚠️ Resume Alert', msg, [
                                { text: 'Resume', type: 'success', onClick: () => form.submit() },
                                { text: 'Reset completely', type: 'danger', onClick: () => {
                                    let confirmMsg = `You are about to delete your colleagues' work! Are you sure?`;
                                    showModal('❌ Final Warning', confirmMsg, [
                                        { text: 'Yes, Delete All', type: 'danger', onClick: () => {
                                            form.action = '/reset_and_start';
                                            form.submit();
                                        }},
                                        { text: 'Cancel Reset', type: 'primary' }
                                    ]);
                                }}
                            ]);
                        }
                    } else {
                        form.submit();
                    }
                })
                .catch(err => {
                    form.submit();
                });
        });
    </script>

</body>

</html>
