<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Submitted Successfully</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}">
    <style>
        body {
            background-color: var(--surface-glass);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            background: var(--surface-glass);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--surface-border);
            animation: fadeInScale 0.4s ease-out forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .success-icon-wrapper {
            width: 90px;
            height: 90px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 0 10px #f0fdf4;
        }

        .success-icon {
            font-size: 48px;
            line-height: 1;
        }

        .success-title {
            color: #15803d;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        .success-subtitle {
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .info-box {
            background: var(--surface-glass);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 30px;
            text-align: start;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-primary);
            font-weight: 600;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary-action {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-primary-action:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-secondary-action {
            background: var(--surface-glass);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
        }

        .btn-secondary-action:hover {
            background: var(--input-bg);
            color: #0f172a;
        }
    </style>

    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        if(localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            
        }
    </script>
</head>
<body>
    <!-- Ambient Blobs -->
    <div class="ambient-blob blob-blue"></div>
    <div class="ambient-blob blob-pink"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" style="z-index: 9999;">
        🌓
    </div>


    <div class="success-card">
        <div class="success-icon-wrapper">
            <span class="success-icon">🎉</span>
        </div>

        <h1 class="success-title">
            Area Report Submitted Successfully!
        </h1>
        
        <p class="success-subtitle">
            All data and issues have been successfully saved and Excel/PDF reports generated.
        </p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">📍 Area:</span>
                <span class="info-value">{{ area_name }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">👤 Monitor Name:</span>
                <span class="info-value">{{ monitor_name }}</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="/" class="btn-action btn-primary-action">
                🏠 Back to Home
            </a>
        </div>
    </div>


    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>
</body>
</html>
