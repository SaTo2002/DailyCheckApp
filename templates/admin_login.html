<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gravity Code</title>
    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Check for saved theme
        if(localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            
        }
    </script>
</head>
<body class="d-flex align-items-center justify-content-center">

    <!-- Ambient Blobs -->
    <div class="ambient-blob blob-blue"></div>
    <div class="ambient-blob blob-pink"></div>

    <div class="glass-card" style="width: 90%; max-width: 400px; text-align: center;">
        <!-- Theme Toggle -->
        <div class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
            🌓
        </div>

        <h2 style="color: var(--brand-blue); margin-bottom: 24px;">
            🔒 Admin Portal
        </h2>
        
        <form method="POST">
            {% if error %}
                <div style="background-color: rgba(220, 53, 69, 0.2); color: var(--danger); padding: 12px; border: 1px solid var(--danger); border-radius: var(--border-radius-sm); margin-bottom: 20px;">
                    {{ error }}
                </div>
            {% endif %}

            <div style="text-align: start; margin-bottom: 20px;">
                <label style="display: block; font-size: 16px; margin-bottom: 8px; font-weight: 600;">Username:</label>
                <input type="text" name="username" required class="glass-input" placeholder="Type username...">
            </div>
            
            <div style="text-align: start; margin-bottom: 30px;">
                <label style="display: block; font-size: 16px; margin-bottom: 8px; font-weight: 600;">Password:</label>
                <input type="password" name="password" required class="glass-input" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; margin-bottom: 20px;">
                Login ➡️
            </button>
            
            <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-block; transition: color var(--transition-fast);">
                🔙 Back to Inspections
            </a>
        </form>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>
</body>
</html>
