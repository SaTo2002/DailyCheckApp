<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Area: {{ area.name }}</title>
    <style>
        

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--primary);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-color);
        }

        .btn-back {
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--surface-glass);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--input-bg);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
            text-align: start;
        }

        .touch-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: var(--surface-glass);
        }

        .touch-input:focus {
            border-color: var(--primary);
            background-color: var(--surface-glass);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, rgba(25, 135, 84, 0.1), rgba(25, 135, 84, 0.2));
            color: var(--text-primary, #fff);
            border: 2px solid var(--success, #198754);
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(25, 135, 84, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: var(--success, #198754);
            color: #fff;
            box-shadow: 0 0 25px rgba(25, 135, 84, 0.6);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            body { padding: 12px 10px; }
            .container { margin: 10px auto; padding: 20px 16px; }
            .page-header { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-back { text-align: center; }
        }
    </style>

    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        if(localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            
        }
    </script>
</head>
<body>
    <!-- Ambient Blobs -->
    <div class="ambient-blob blob-blue"></div>
    <div class="ambient-blob blob-pink"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" style="z-index: 9999;">
        🌓
    </div>

    <div class="container">
        <div class="page-header">
            <h2>📍 Edit Area: <span style="color: var(--primary);">{{ area.name }}</span></h2>
            <div style="display: flex; gap: 8px; align-items: center;">
                
                
                <a href="/manage_system" class="btn-back">🔙 Cancel & Return</a>
            </div>
        </div>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="area_name">🏷️ New Area Name:</label>
                <input type="text" id="area_name" name="area_name" value="{{ area.name }}" class="touch-input" required autofocus placeholder="Enter area name...">
            </div>

            <div class="form-group">
                <label>📄 PDF & Excel Report Print Orientation:</label>
                <div style="display: flex; gap: 15px; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; background: var(--surface-glass); padding: 10px 14px; border: 2px solid var(--surface-border); border-radius: 8px; flex: 1;">
                        <input type="radio" name="pdf_orientation" value="portrait" {% if area.pdf_orientation != 'landscape' %}checked{% endif %}>
                        📱 <strong>Portrait</strong>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; background: var(--surface-glass); padding: 10px 14px; border: 2px solid var(--surface-border); border-radius: 8px; flex: 1;">
                        <input type="radio" name="pdf_orientation" value="landscape" {% if area.pdf_orientation == 'landscape' %}checked{% endif %}>
                        🖥️ <strong>Landscape</strong>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="area_image">🖼️ Change Area Cover Image:</label>
                {% if area.image %}
                <div style="margin-bottom: 10px;">
                    <img src="{{ area.image }}" alt="Cover" style="max-width: 100%; max-height: 120px; border-radius: 8px; border: 1px solid var(--border-color); object-fit: cover;">
                </div>
                {% endif %}
                <input type="file" id="area_image" name="area_image" accept="image/*" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; background: var(--surface-glass); width: 100%; box-sizing: border-box;">
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 10px;">💾 Save Changes</button>
        </form>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>
</body>
</html>
